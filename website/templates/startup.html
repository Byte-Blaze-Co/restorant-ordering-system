<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kurulum Sihirbazı</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <form id="setupForm" class="w-full max-w-2xl bg-white p-10 rounded-2xl shadow-xl space-y-8" method="POST" action="/submit-setup" enctype="multipart/form-data">
        
        <!-- Adım 1: Dil Seçimi -->
        <div class="step active">
            <h2 class="text-2xl font-bold mb-4">1. Dil Seçimi</h2>
            <label class="block mb-2 font-semibold">Sistem Dili:</label>
            <select name="language" class="w-full border border-gray-300 rounded p-2" data-required>
                <option value="">Bir dil seçin</option>
                <option value="tr">Türkçe</option>
                <option value="en">English</option>
            </select>
        </div>

        <!-- Adım 2: Şirket Bilgileri -->
        <div class="step">
            <h2 class="text-2xl font-bold mb-4">2. Şirket Bilgileri</h2>
            <label class="block mb-2 font-semibold">Şirket Adı:</label>
            <input name="company_name" type="text" class="w-full border border-gray-300 rounded p-2" data-required>
            <label class="block mt-4 mb-2 font-semibold">Logo:</label>
            <input name="logo" type="file" class="w-full border border-gray-300 rounded p-2">
        </div>

        <!-- Adım 3: Saat Dilimi -->
        <div class="step">
            <h2 class="text-2xl font-bold mb-4">3. Saat Dilimi</h2>
            <label class="block mb-2 font-semibold">Saat Dilimi:</label>
            <select name="timezone" class="w-full border border-gray-300 rounded p-2" data-required>
                <option value="">Bir saat dilimi seçin</option>
                <option value="Europe/Istanbul">Europe/Istanbul</option>
                <option value="UTC">UTC</option>
                <option value="America/New_York">America/New_York</option>
            </select>
        </div>

        <!-- Adım 4: Lisans Bilgileri -->
        <div class="step">
            <h2 class="text-2xl font-bold mb-4">4. Lisans Anahtarı</h2>
            <label class="block mb-2 font-semibold">Lisans Anahtarı:</label>
            <input name="license_key" id="licenseInput" maxlength="29" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" class="w-full border border-gray-300 rounded p-2" data-required>
        </div>

        <!-- Adım 5: Sözleşmeler -->
        <div class="step">
            <h2 class="text-2xl font-bold mb-4">5. Sözleşmeler ve Onaylar</h2>
            <label class="flex items-center space-x-2 mb-4">
                <input type="checkbox" name="accept_terms" data-required>
                <span>Kullanım koşullarını kabul ediyorum</span>
            </label>
            <label class="flex items-center space-x-2 mb-4">
                <input type="checkbox" name="allow_usage_data">
                <span>Deneyimlerime göre yazılımın geliştirilmesine katkı sağlayabilirim</span>
            </label>
            <label class="flex items-center space-x-2">
                <input type="checkbox" name="auto_updates">
                <span>Yazılım güncellemelerini otomatik al</span>
            </label>
        </div>

        <!-- Butonlar -->
        <div class="flex justify-between">
            <button type="button" id="prevBtn" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded" disabled>Geri</button>
            <button type="button" id="nextBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">İleri</button>
            <button type="submit" id="submitBtn" class="hidden bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">Tamamla</button>
        </div>
    </form>

    <script>
        const steps = document.querySelectorAll('.step');
        let currentStep = 0;

        function showStep(index) {
            steps.forEach((step, i) => {
                step.classList.toggle('active', i === index);
            });

            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').classList.toggle('hidden', index === steps.length - 1);
            document.getElementById('submitBtn').classList.toggle('hidden', index !== steps.length - 1);
        }

        function validateStep(stepIndex) {
            const inputs = steps[stepIndex].querySelectorAll('[data-required]');
            for (const input of inputs) {
                if ((input.type === 'checkbox' && !input.checked) ||
                    (input.type !== 'checkbox' && !input.value)) {
                    alert('Lütfen gerekli alanları doldurun.');
                    input.focus();
                    return false;
                }
            }
            return true;
        }

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (validateStep(currentStep)) {
                currentStep++;
                showStep(currentStep);
            }
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentStep--;
            showStep(currentStep);
        });

        // Lisans anahtarı formatlayıcı
        const licenseInput = document.getElementById('licenseInput');
        licenseInput.addEventListener('input', function () {
            let value = this.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 5 === 0) formatted += '-';
                formatted += value[i];
            }
            this.value = formatted;
        });

        // Submit validasyon kontrolü
        document.getElementById('setupForm').addEventListener('submit', function (e) {
            for (let i = 0; i < steps.length; i++) {
                if (!validateStep(i)) {
                    e.preventDefault();
                    currentStep = i;
                    showStep(i);
                    return;
                }
            }
        });

        showStep(currentStep);
    </script>
</body>
</html>
