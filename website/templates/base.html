<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap and FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js"></script>
    <script src="https://kit.fontawesome.com/e24507d923.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>Garden | {% block title %} {% endblock %}</title>

    <style>
        /* Genel Sayfa Stilleri */
        body {
            background-color: rgb(24, 129, 1);
            padding: 0;
            margin: 0;
            animation: fadeIn 1.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .navbar {
            background-color: #fff;
            animation: slideIn 0.5s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100%);
            }
            to {
                transform: translateY(0);
            }
        }

        #items {
            display: flex;
            align-items: center;
            margin-left: auto;
        }

        .nav-link {
            color: black;
            transition: color 0.3s;
        }

        .nav-item {
            margin: 0 10px;
        }

        .nav-link:hover {
            color: rgb(65, 234, 9);
            transform: scale(1.1);
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        footer {
            animation: slideUp 0.5s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        /* Tüm marginleri sıfırlamak için */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Mobil için özel düzenlemeler */
        @media (max-width: 768px) {
            #items {
                flex-direction: row;
                justify-content: flex-end;
                gap: 15px;
            }

            .nav-item {
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar Section -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/" style="font-family: cursive; font-size: 35px;">Bilgin Garden</a>

            <!-- Navbar Toggle (for small screens) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapsible menu (About and Instagram links) -->
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Hakkımızda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.instagram.com/bilgingarden/">İnstagram Sayfamız</a>
                    </li>
                </ul>
            </div>

            <!-- Cart and Orders (Always visible) -->
            <ul class="navbar-nav" id="items">
                <li class="nav-item">
                    <a class="nav-link text-grey" href="/cart">
                        {% if cart | length < 1 %}
                        Sepetim <i class="fa-solid fa-cart-shopping"></i>
                        {% else %}
                        Sepetim <i class="bi bi-{{ cart | length }}-square-fill"></i>
                        {% endif %}
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-grey" href="/orders">Siparişlerim 🧺</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Flash messages section -->
    {% for message in get_flashed_messages() %}
    <div class="alert alert-success alert-dismissible fade show" role="alert" style="margin-top: 5px;">
        <strong>{{ message }}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}

    {% block body %}
    {% endblock %}

    <!-- Footer Section -->
    <footer class="container-fluid text-center p-2 mt-5" style="background-color: rgb(68, 156, 9); color: white;">
        <a href="https://RestorantUrl.com" style="color: white;">Garden</a> | <span><i class="fa-sharp fa-regular fa-copyright"></i></span> 2024 Tüm hakları saklıdır.
        <a href="/login" style="color: rgb(65, 234, 9); background-color: green;">Admin Giriş</a>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/owl.carousel.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/all.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.js') }}"></script>
    <script src="{{ url_for('static', filename='js/myScript.js') }}"></script>

</body>

</html>
