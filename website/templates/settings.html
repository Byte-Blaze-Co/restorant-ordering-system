<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayarlar - Admin Paneli</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        /* Global Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7fc;
            overflow-x: hidden;
        }
        
        /* Sidebar Styles */
        .sidebar {
            width: 80px;
            height: 100vh;
            background-color: #1a1a2e;
            transition: width 0.3s ease;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar.expanded {
            width: 250px;
        }

        .sidebar .logo {
            padding: 20px;
            color: #fff;
            text-align: center;
            font-size: 1.5rem;
            background-color: #162447;
            cursor: pointer;
        }

        .sidebar ul {
            padding: 0;
            list-style-type: none;
        }

        .sidebar ul li {
            width: 100%;
        }

        .sidebar ul li a {
            text-decoration: none;
            color: #fff;
            padding: 15px;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }

        .sidebar ul li a i {
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .sidebar ul li a:hover {
            background-color: #0f3460;
            transform: translateX(10px);
        }

        .sidebar ul li a span {
            display: none;
            transition: all 0.3s;
        }

        .sidebar.expanded ul li a span {
            display: inline-block;
            font-size: 1.1rem;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 80px;
            padding: 30px;
            transition: margin-left 0.3s ease;
        }

        .main-content.expanded {
            margin-left: 250px;
        }

        /* Settings Page Styles */
        .settings-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .settings-container h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #162447;
        }

        .settings-container p {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #495057;
        }

        .settings-container .btn-change-password {
            background-color: #1f4068;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .settings-container .btn-change-password:hover {
            background-color: #162447;
        }
        
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="logo" id="logo">BB</div>
        <ul>
            <li>
                <a href="/dashboard" class="nav-link">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/shop-items" class="nav-link">
                    <i class="fas fa-box"></i>
                    <span>Satıştaki Ürünler</span>
                </a>
            </li>
            <li>
                <a href="/employee-management" class="nav-link">
                    <i class="fas fa-user"></i>
                    <span>Çalışan Yönetimi</span>
                </a>
            </li>
            <li>
                <a href="/settings" class="nav-link">
                    <i class="fas fa-cog"></i>
                    <span>Ayarlar</span>
                </a>
            </li>
            <li>
                <a href="/add-shop-items" class="nav-link">
                    <i class="fas fa-plus"></i>
                    <span>Ürün Ekle</span>
                </a>
            </li>
            <li>
                <a href="/admin-page" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>Ana Sayfa</span>
                </a>
            </li>
        </ul>
    </div>


    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <h1>Ayarlar</h1>
        <div class="settings-container">
            <h3>Admin Bilgileri</h3>
            <p><strong>Kullanıcı Adı:</strong> admin_user</p>
            <p><strong>Şifre:</strong> *******</p>
            <a href="/change-password" class="btn-change-password">Parolayı Değiştir</a>
        </div>
    </div>

    <!-- Toggle Sidebar Script -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const logo = document.getElementById('logo');

        logo.addEventListener('click', () => {
            sidebar.classList.toggle('expanded');
            mainContent.classList.toggle('expanded');
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
