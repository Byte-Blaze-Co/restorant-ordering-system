<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelirler - Admin Paneli</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <style>
        /* Global Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7fc;
            overflow-x: hidden;
        }
        
        /* Sidebar Styles */
        .sidebar {
            width: 80px;
            height: 100vh;
            background-color: #1a1a2e;
            transition: width 0.3s ease;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar.expanded {
            width: 250px;
        }

        .sidebar .logo {
            padding: 20px;
            color: #fff;
            text-align: center;
            font-size: 1.5rem;
            background-color: #162447;
            cursor: pointer;
        }

        .sidebar ul {
            padding: 0;
            list-style-type: none;
        }

        .sidebar ul li {
            width: 100%;
        }

        .sidebar ul li a {
            text-decoration: none;
            color: #fff;
            padding: 15px;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }

        .sidebar ul li a i {
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .sidebar ul li a:hover {
            background-color: #0f3460;
            transform: translateX(10px);
        }

        .sidebar ul li a span {
            display: none;
            transition: all 0.3s;
        }

        .sidebar.expanded ul li a span {
            display: inline-block;
            font-size: 1.1rem;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 80px;
            padding: 30px;
            transition: margin-left 0.3s ease;
        }

        .main-content.expanded {
            margin-left: 250px;
        }

        /* Chart Section */
        .chart-container {
            margin: 20px 0;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .table-container {
            margin-top: 30px;
        }

        /* Flash Messages */
        .flash-message {
            margin-top: 20px;
        }

        /* Responsive for Mobile */
        @media (max-width: 768px) {
            .sidebar {
                width: 50px;
            }

            .sidebar.expanded {
                width: 200px;
            }

            .main-content {
                margin-left: 50px;
            }

            .main-content.expanded {
                margin-left: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="logo" id="logo">BB</div>
        <ul>
            <li>
                <a href="/dashboard" class="nav-link">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/shop-items" class="nav-link">
                    <i class="fas fa-box"></i>
                    <span>Satıştaki Ürünler</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i class="fas fa-user"></i>
                    <span>Çalışan Yönetimi</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i class="fas fa-cog"></i>
                    <span>Ayarlar</span>
                </a>
            </li>
            <li>
                <a href="/add-shop-items" class="nav-link">
                    <i class="fas fa-plus"></i>
                    <span>Ürün Ekle</span>
                </a>
            </li>
            <li>
                <a href="/admin-page" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>Ana Sayfa</span>
                </a>
            </li>
        </ul>
    </div>


    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <!-- Flash messages section -->
        <div class="flash-message">
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>Gelir verisi güncellendi!</strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <h1>Gelir Analizi</h1>

        <!-- Chart Section -->
        <div class="chart-container">
            <canvas id="incomeChart"></canvas>
        </div>

        <!-- Table Section -->
        <div class="table-container">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th scope="col">Ay</th>
                        <th scope="col">Gelir</th>
                        <th scope="col">Gider</th>
                        <th scope="col">Net Kar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Ocak</td>
                        <td>₺10,000</td>
                        <td>₺4,000</td>
                        <td>₺6,000</td>
                    </tr>
                    <tr>
                        <td>Şubat</td>
                        <td>₺8,000</td>
                        <td>₺3,500</td>
                        <td>₺4,500</td>
                    </tr>
                    <!-- Diğer aylar burada olabilir -->
                </tbody>
            </table>
        </div>

    </div>

    <!-- Toggle Sidebar Script -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const logo = document.getElementById('logo');

        logo.addEventListener('click', () => {
            sidebar.classList.toggle('expanded');
            mainContent.classList.toggle('expanded');
        });

        // Chart.js Configuration
        const ctx = document.getElementById('incomeChart').getContext('2d');
        const incomeChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran'],
                datasets: [{
                    label: 'Gelir',
                    data: [10000, 8000, 12000, 14000, 9000, 15000],
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
