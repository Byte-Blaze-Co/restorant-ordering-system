<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a4d, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            animation: backgroundAnimation 15s ease infinite;
        }

        @keyframes backgroundAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease-in-out;
            backdrop-filter: blur(10px);
        }

        h3 {
            color: #00aaff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: slideIn 0.5s ease-in-out;
        }

        hr {
            border: 1px solid #00aaff;
            margin: 20px 0;
        }

        .form-control {
            border: none;
            border-bottom: 2px solid #00aaff;
            border-radius: 0;
            background: transparent;
            color: #fff;
            transition: border-color 0.3s;
            padding: 10px 5px;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: #00eaff;
            box-shadow: none;
        }

        .btn-submit {
            background-color: #00aaff;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            width: 100%;
            transition: background-color 0.3s, transform 0.3s;
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        .btn-submit:hover {
            background-color: #00eaff;
            transform: scale(1.05);
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animated-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://source.unsplash.com/featured/?futuristic,technology') center/cover;
            opacity: 0.2;
            animation: pulse 10s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <!-- Flash messages section -->
        {% for message in get_flashed_messages() %}
        <div class="alert alert-success alert-dismissible fade show flash-message" role="alert">
            <strong>{{ message }}</strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    <div>
    <div class="animated-background"></div>
    
    <div class="login-container">
        <h3>Admin Paneline Giriş Yap</h3>
        <hr>
        <form method="POST">
            {{ form.hidden_tag() }}
            <div class="mb-3">
                <label for="email" class="form-label text-white">E-Posta Adresi</label>
                {{ form.email(class="form-control", id="email") }}
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-white">Şifre</label>
                {{ form.password(class="form-control", id="password") }}
            </div>
            <div class="buttons">
                {{ form.submit(class="btn btn-submit") }}
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
